# pnpm 10+ reads settings from here rather than package.json's "pnpm" field.
# `deno` (used by the check:edge script) runs a postinstall to place its
# binary; without this, every install ends in ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
    deno: true
minimumReleaseAgeExclude:
    - '@expo/cli@57.0.12 || 57.0.13'
    - '@expo/router-server@57.0.5'
    - expo-constants@57.0.9
    - expo-modules-core@57.0.9 || 57.0.10
    - expo@57.0.10 || 57.0.11
    - '@expo/ui@57.0.9'
    - expo-image@57.0.2
    - expo-linking@57.0.5
    - expo-router@57.0.10 || 57.0.11
    - expo-updates@57.0.12
    - '@expo/config-plugins@57.0.7'
    - babel-preset-expo@57.0.6
    - expo-asset@57.0.9
    - expo-file-system@57.0.2
    - expo-image-picker@57.0.8
    - expo-notifications@57.0.9
    - expo-sharing@57.0.10
    - expo-symbols@57.0.2
