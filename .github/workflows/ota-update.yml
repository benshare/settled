name: OTA Update

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    update:
        name: Publish EAS Update
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Setup EAS
              uses: expo/expo-github-action@v8
              with:
                  eas-version: latest
                  token: ${{ secrets.EXPO_TOKEN }}

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Publish update
              env:
                  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
                  SUPABASE_PUBLIC_KEY: ${{ secrets.SUPABASE_PUBLIC_KEY }}
                  # Via env, not inline `${{ }}` — the message is untrusted text and
                  # would otherwise be pasted straight into the shell command.
                  COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual update' }}
              run: |
                  eas update \
                    --branch production \
                    --environment production \
                    --message "$COMMIT_MESSAGE" \
                    --non-interactive
